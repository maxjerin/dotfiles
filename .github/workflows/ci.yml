---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install lint dependencies
        run: pip3 install yamllint ansible ansible-lint

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: shellcheck
        run: shellcheck ./*.sh repo_config/pre-commit
